<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Верифицирован - Football App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .logo {
            font-size: 2em;
            color: #667eea;
            margin-bottom: 20px;
        }
        .success-icon {
            font-size: 4em;
            color: #28a745;
            margin: 20px 0;
        }
        .message {
            font-size: 1.2em;
            margin: 20px 0;
            padding: 20px;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            border-radius: 5px;
        }
        .btn {
            background: #667eea;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 10px;
            font-size: 1em;
        }
        .btn:hover {
            background: #5a6fd8;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚽ Football App</div>
        <div class="success-icon">✅</div>
        <h2>Email Успешно Верифицирован!</h2>
        
        <div class="message">
            <h3>🎉 Поздравляем!</h3>
            <p>Ваш email адрес был успешно подтвержден.</p>
            <p>Теперь вы можете войти в систему и использовать все возможности приложения.</p>
        </div>
        
        <div class="actions">
            <a href="/" class="btn">Перейти на главную</a>
            <a href="/login" class="btn btn-secondary">Войти в систему</a>
        </div>
        
        <div style="margin-top: 30px; font-size: 0.9em; color: #666;">
            <p>Спасибо за регистрацию в Football App!</p>
        </div>
    </div>
</body>
</html>
