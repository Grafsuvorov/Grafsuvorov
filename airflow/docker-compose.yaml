services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME}
    command: webserver
    depends_on:
      airflow-scheduler:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      DB_URL: postgresql+psycopg2://postgres:0506@edgescore-db-shared:5432/dwh
      PGHOST: edgescore-db-shared
      PGPORT: "5432"
      PGDATABASE: dwh
      PGUSER: postgres
      PGPASSWORD: "0506"
      AIRFLOW__CORE__FERNET_KEY: ""
      AIRFLOW__WEBSERVER__SECRET_KEY: "replace-with-long-static-secret"
      AIRFLOW__SCHEDULER__ZOMBIE_TASK_THRESHOLD: "1800"
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_SEC: "30"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__LOGGING__LOG_FILENAME_TEMPLATE: "{{ ti.dag_id }}__{{ ti.task_id }}__{{ ti.run_id }}__{{ try_number }}.log"
      _PIP_ADDITIONAL_REQUIREMENTS: "requests pandas sqlalchemy psycopg2-binary apache-airflow-providers-postgres xgboost joblib scikit-learn curl_cffi"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /Users/nikitasuvorov/Projects/Grafsuvorov/football_new/scripts:/opt/airflow/scripts
      - /Users/nikitasuvorov/Projects/Grafsuvorov/football_new/frontend/model:/opt/airflow/model
    networks:
      - default
      - shared_db
    restart: unless-stopped

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME}
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      DB_URL: postgresql+psycopg2://postgres:0506@edgescore-db-shared:5432/dwh
      PGHOST: edgescore-db-shared
      PGPORT: "5432"
      PGDATABASE: dwh
      PGUSER: postgres
      PGPASSWORD: "0506"
      AIRFLOW__WEBSERVER__SECRET_KEY: "replace-with-long-static-secret"
      AIRFLOW__SCHEDULER__ZOMBIE_TASK_THRESHOLD: "1800"
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_SEC: "30"
      AIRFLOW__LOGGING__LOG_FILENAME_TEMPLATE: "{{ ti.dag_id }}__{{ ti.task_id }}__{{ ti.run_id }}__{{ try_number }}.log"
      _PIP_ADDITIONAL_REQUIREMENTS: "requests pandas sqlalchemy psycopg2-binary apache-airflow-providers-postgres xgboost joblib scikit-learn curl_cffi"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /Users/nikitasuvorov/Projects/Grafsuvorov/football_new/scripts:/opt/airflow/scripts
      - /Users/nikitasuvorov/Projects/Grafsuvorov/football_new/frontend/model:/opt/airflow/model
    networks:
      - default
      - shared_db
    restart: unless-stopped

  airflow-worker:
    image: ${AIRFLOW_IMAGE_NAME}
    command: celery worker
    depends_on:
      airflow-scheduler:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      DB_URL: postgresql+psycopg2://postgres:0506@edgescore-db-shared:5432/dwh
      PGHOST: edgescore-db-shared
      PGPORT: "5432"
      PGDATABASE: dwh
      PGUSER: postgres
      PGPASSWORD: "0506"
      AIRFLOW__WEBSERVER__SECRET_KEY: "replace-with-long-static-secret"
      AIRFLOW__SCHEDULER__ZOMBIE_TASK_THRESHOLD: "1800"
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_SEC: "30"
      AIRFLOW__LOGGING__LOG_FILENAME_TEMPLATE: "{{ ti.dag_id }}__{{ ti.task_id }}__{{ ti.run_id }}__{{ try_number }}.log"
      _PIP_ADDITIONAL_REQUIREMENTS: "requests pandas sqlalchemy psycopg2-binary apache-airflow-providers-postgres xgboost joblib scikit-learn curl_cffi"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /Users/nikitasuvorov/Projects/Grafsuvorov/football_new/scripts:/opt/airflow/scripts
      - /Users/nikitasuvorov/Projects/Grafsuvorov/football_new/frontend/model:/opt/airflow/model
    networks:
      - default
      - shared_db
    restart: unless-stopped

  airflow-triggerer:
    image: ${AIRFLOW_IMAGE_NAME}
    command: triggerer
    depends_on:
      airflow-scheduler:
        condition: service_started
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      DB_URL: postgresql+psycopg2://postgres:0506@edgescore-db-shared:5432/dwh
      PGHOST: edgescore-db-shared
      PGPORT: "5432"
      PGDATABASE: dwh
      PGUSER: postgres
      PGPASSWORD: "0506"
      AIRFLOW__WEBSERVER__SECRET_KEY: "replace-with-long-static-secret"
      AIRFLOW__SCHEDULER__ZOMBIE_TASK_THRESHOLD: "1800"
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_SEC: "30"
      AIRFLOW__LOGGING__LOG_FILENAME_TEMPLATE: "{{ ti.dag_id }}__{{ ti.task_id }}__{{ ti.run_id }}__{{ try_number }}.log"
      _PIP_ADDITIONAL_REQUIREMENTS: "requests pandas sqlalchemy psycopg2-binary apache-airflow-providers-postgres xgboost joblib scikit-learn curl_cffi"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - /Users/nikitasuvorov/Projects/Grafsuvorov/football_new/scripts:/opt/airflow/scripts
      - /Users/nikitasuvorov/Projects/Grafsuvorov/football_new/frontend/model:/opt/airflow/model
    networks:
      - default
      - shared_db
    restart: unless-stopped

  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME}
    entrypoint: /bin/bash
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -c
      - |
        set -e
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /sources/{logs,dags,plugins}
        airflow db migrate
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname Air \
          --lastname Flow \
          --role Admin \
          --email admin@example.com || true
    environment:
      AIRFLOW__CORE__EXECUTOR: CeleryExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
      AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
      _PIP_ADDITIONAL_REQUIREMENTS: "requests pandas sqlalchemy psycopg2-binary apache-airflow-providers-postgres xgboost joblib scikit-learn curl_cffi"
      AIRFLOW_UID: ${AIRFLOW_UID}
    user: "0:0"
    volumes:
      - ./dags:/sources/dags
      - ./logs:/sources/logs
      - ./plugins:/sources/plugins

volumes:
  postgres-db-volume:

networks:
  shared_db:
    external: true
