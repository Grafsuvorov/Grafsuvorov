services:
  frontend:
    build:
      context: .
      args:
        VITE_AUTH_ENABLED: ${VITE_AUTH_ENABLED:-true}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-15312}:8080"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env
    volumes:
      - ${HOST_APP_DIR:-/root/table-dependency-viewer}/scripts:/app/scripts:ro
      - ${HOST_APP_DIR:-/root/table-dependency-viewer}/meta_info:/app/meta_info
      - ${HOST_APP_DIR:-/root/table-dependency-viewer}/meta_info_dev:/app/meta_info_dev
      - ${HOST_APP_DIR:-/root/table-dependency-viewer}/config_files:/app/config_files
      - ${HOST_GIT_DIR:-/root/git_dir}:/root/git_dir
      - ${HOST_META_WORKSPACE_ROOT:-/var/lib/table-dependency-viewer/meta-workspaces}:/var/lib/table-dependency-viewer/meta-workspaces
    ports:
      - "${API_PORT:-5312}:8000"
    restart: unless-stopped
