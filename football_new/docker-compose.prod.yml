services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DWH_DATABASE_URL: ${DWH_DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS}
      AUDIT_ADMIN_EMAILS: ${AUDIT_ADMIN_EMAILS:-}
      ROI_ADMIN_EMAILS: ${ROI_ADMIN_EMAILS:-}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.yandex.ru}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_LOGIN: ${SMTP_LOGIN:-support@edgescore.pro}
      SMTP_PASS: ${SMTP_PASS:-}
      YANDEX_APP_PASSWORD: ${YANDEX_APP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-support@edgescore.pro}
      ENABLE_TEST_ROUTES: "false"
      ENABLE_DEBUG_ROUTES: "false"
      LOG_ROUTES_ON_STARTUP: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - football_internal
      - shared_db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUDIT_ADMIN_EMAILS: ${VITE_AUDIT_ADMIN_EMAILS:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-80}:80"
    networks:
      - football_internal

networks:
  football_internal:
  shared_db:
    external: true
